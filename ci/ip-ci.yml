name: ip-ci

# 각 IP repo 루트의 .github/workflows/ip-ci.yml 로 복사.
# 정책은 reusable workflow 에 위임.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:     ['v*']

jobs:
  lint:
    uses: acme-ssd/.github/.github/workflows/reusable-lint.yml@main
    with:
      target_dir: rtl/
      waivers:    cfg/waivers.yaml

  yaml-schema:
    uses: acme-ssd/.github/.github/workflows/reusable-yaml-schema.yml@main
    with:
      schema: https://raw.githubusercontent.com/acme-ssd/.github/main/schemas/ip-yaml.json
      target: ip.yaml

  smoke-sim:
    uses: acme-ssd/.github/.github/workflows/reusable-smoke-sim.yml@main
    with:
      tb_dir: sim/

  diagram-drift:
    # WaveDrom JSON source 가 있으면 SVG를 재렌더하고 git diff 가 비어 있어야 PASS.
    # source 만 고치고 SVG 재생성을 잊은 PR 을 잡아낸다.
    # (Mermaid 는 GitHub 가 inline 렌더하므로 별도 단계 불필요.)
    if: hashFiles('doc/diagrams/*.json', 'doc/diagrams/*.json5') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Render WaveDrom diagrams (check drift)
        run: bash tools/render-diagrams.sh --check .

  workflow-validate:
    # docs/WORKFLOW.md §3 의 closed-loop invariant 검사.
    # DESIGN.md ↔ IP-XACT, IP-XACT ↔ HAL, Guide ↔ HAL,
    # Guide ↔ scenarios, scenarios ↔ TB 의 cross-document 정합성을 모두 본다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: ipflow validate (this IP)
        run: python3 tools/ipflow.py validate .

  semver-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check ip.yaml version bumped vs base
        run: python3 .ci/check_semver_bump.py ip.yaml ${{ github.base_ref }}

  codeowners-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CODEOWNERS matches ip.yaml
        run: python3 .ci/sync_codeowners.py --repo . --check

  notify-manifest:
    needs: [lint, yaml-schema, smoke-sim, diagram-drift, workflow-validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manifest-bot
        run: |
          gh api repos/acme-ssd/ssd-soc-manifest/dispatches \
            -f event_type=ip-tag-published \
            -f client_payload[ip]=${{ github.event.repository.name }} \
            -f client_payload[tag]=${{ github.ref_name }} \
            -f client_payload[sha]=${{ github.sha }}
        env: { GH_TOKEN: ${{ secrets.MANIFEST_BUMP_TOKEN }} }
