name: manifest-bot

# ssd-soc-manifest repo 에 설치되는 자동 갱신 봇.
# - IP repo 가 새 tag 를 push 하면 repository_dispatch 이벤트를 받아 default.xml 의 revision 을 업데이트하는 PR 자동 생성.
# - 매일 자정 dependabot-style 으로 모든 IP 의 최신 tag 와 manifest 가 어긋나는지 점검.

on:
  repository_dispatch:
    types: [ip-tag-published]
  schedule:
    - cron: '0 0 * * *'      # 매일 00:00 UTC
  workflow_dispatch:

jobs:
  bump:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump manifest pin
        run: |
          python3 .ci/manifest_bump.py bump \
            --manifest default.xml \
            --name     ${{ github.event.client_payload.ip }} \
            --revision ${{ github.event.client_payload.tag }}

      - name: Open PR
        run: |
          BRANCH="bump/${{ github.event.client_payload.ip }}-${{ github.event.client_payload.tag }}"
          git config user.name  "ssd-soc-bot"
          git config user.email "bot@acme-ssd"
          git checkout -b "$BRANCH"
          git commit -am "bump ${{ github.event.client_payload.ip }} → ${{ github.event.client_payload.tag }}"
          git push -u origin "$BRANCH"
          gh pr create --fill \
              --title "manifest: ${{ github.event.client_payload.ip }} → ${{ github.event.client_payload.tag }}" \
              --body "Auto-generated by manifest-bot. SHA: ${{ github.event.client_payload.sha }}" \
              --label "auto,manifest-bump"
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

  drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check each project for newer tag than manifest pin
        run: python3 .ci/manifest_drift.py --manifest default.xml --report drift.md
      - name: Post drift report
        if: hashFiles('drift.md') != ''
        run: gh issue create --title "Weekly manifest drift report" --body-file drift.md
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
