# IP metadata — IPLM-lite schema v1
# 본 파일이 IP의 single source of truth. CODEOWNERS, manifest, CI가 모두 참조.
name: irq_ctrl
version: 1.0.0           # first synthesizable / verified release
status: alpha            # proto | alpha | qual | gold
owner: @ssd-soc/cpu-team
subsystem: cpu_ss
description: |
  PLIC-style platform-level interrupt controller (single hart, single context).
  32 sources incl. reserved source 0, per-source 4-bit priority + enable,
  global threshold, claim/complete handshake.
bus: apb                  # axi | apb | ahb
parameters:
  NUM_IRQ: 32             # includes reserved source 0
  PRIO_W: 4
dependencies:
  - common-libs >= 1.0.0
license: Apache-2.0
language: SystemVerilog
qual:
  lint: pending
  cdc: pending
  coverage: pending
  qual_report: null
files:
  rtl:
    - rtl/irq_ctrl.sv
  sim:
    - sim/tb_irq_ctrl.sv
  doc:
    - doc/DESIGN.md
    - doc/PROGRAMMERS_GUIDE.md
    - doc/irq_ctrl.ipxact.xml
    - doc/diagrams/  # WaveDrom JSON + 렌더된 SVG
  sw:
    - sw/irq_ctrl_hal.h
    - sw/irq_ctrl_hal.c
    - sw/test_hal_host.c
    - sw/Makefile
